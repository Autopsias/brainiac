name: npm-publish

# Publishes `brainiac-install` to npm from CI via TRUSTED PUBLISHING (OIDC) —
# no long-lived token anywhere, and provenance is attached automatically
# because both this repo and the package are public.
#
# Why this exists (2026-08-07): npm publishing has been a local act using the
# operator's own credentials, which broke a release the same day (an
# unauthenticated npm surfaced as a misleading E404 on PUT, after PyPI had
# already published). More pressingly, GitHub's 2026-07-31 change removes
# direct publish from 2FA-bypass granular tokens in January 2027, so the
# token-in-.npmrc path has a deadline. Trusted publishing is the replacement
# GitHub steers to, and it takes credentials out of the release entirely.
#
# BEFORE THIS CAN WORK the package owner must add a trusted publisher on
# npmjs.com (package settings -> Trusted publishers):
#     organization/user: Autopsias
#     repository:        brainiac
#     workflow filename: npm-publish.yml
#     allowed actions:   npm publish
# That is an owner action in the npm web UI — configuring it now itself
# requires an interactive 2FA challenge — and it CANNOT be done from here.
# Until it is configured, this workflow fails at the publish step with an
# auth error and the release pipeline's local npm phase remains the path.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish from (e.g. v0.20.1)"
        required: true

permissions:
  contents: read
  id-token: write   # mandatory: this is what mints the OIDC token

jobs:
  publish:
    runs-on: ubuntu-latest   # trusted publishing requires a GitHub-hosted runner
    steps:
      # Deliberately NOT `ref: ${{ inputs.tag }}`. A workflow_dispatch input in
      # a checkout `ref:` is a ref-injection surface; it is validated below and
      # only then checked out, so nothing unvalidated reaches the action.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select and validate the tag
        id: tag
        shell: bash
        env:
          REF_NAME_RAW: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$REF_NAME_RAW" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "refusing a tag that is not vX.Y.Z: ${REF_NAME_RAW}" >&2
            exit 1
          fi
          git checkout --quiet "refs/tags/${REF_NAME_RAW}"
          echo "ref_name=${REF_NAME_RAW}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"          # trusted publishing needs >= 22.14.0
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure an npm new enough for trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          # This step used to run `npm install -g npm@latest` (Codex cloud
          # review, 2026-08-07). That is an unpinned, network-fetched package
          # whose install-time lifecycle code would run in a job holding
          # `id-token: write` — i.e. code that could mint an npm-trusted
          # publishing token before the real publish ever happens.
          #
          # It also turned out to be unnecessary. `setup-node` with
          # `node-version: "24"` resolves to the newest 24.x, which bundles
          # npm 11.17.0 (checked 2026-08-07); only v24.0.x ever shipped an npm
          # below the 11.5.1 that trusted publishing requires. So the fetch is
          # replaced by an ASSERTION: no install, and a runner that ever does
          # ship an old npm fails loudly here instead of silently publishing.
          have="$(npm --version)"
          need="11.5.1"
          echo "npm ${have} (trusted publishing needs >= ${need})"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
            echo "npm ${have} is older than ${need}; bump node-version" >&2
            exit 1
          fi

      - name: Publish, but only if the tag and the package agree
        shell: bash
        env:
          # The validated value from the step above, never the raw input.
          REF_NAME: ${{ steps.tag.outputs.ref_name }}
        working-directory: packaging/npm/brainiac-install
        run: |
          set -euo pipefail
          tag_version="${REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          pkg_name="$(node -p "require('./package.json').name")"
          echo "tag=${REF_NAME} tag_version=${tag_version} package=${pkg_name}@${pkg_version}"

          # The 2026-07-29 post-mortem: a tag cut one commit early shipped a
          # build without the fixes it was named for, and nothing cross-checked
          # tag content against intent. Cheapest possible version of that check.
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "tag ${REF_NAME} does not match package.json ${pkg_version}" >&2
            exit 1
          fi

          # Idempotent: a re-run after a partial release must not fail on
          # "cannot publish over an existing version".
          if npm view "${pkg_name}@${pkg_version}" version >/dev/null 2>&1; then
            echo "${pkg_name}@${pkg_version} is already on the registry — nothing to do"
            exit 0
          fi

          npm publish --access public

  # A pushed tag is NOT a GitHub Release — they are separate objects. This repo
  # had six Releases created by hand on 2026-08-07 and none after, so the
  # Releases page silently fell four versions behind while the tags, the code
  # and npm were all current (found 2026-08-15, on v0.20.10).
  #
  # SEPARATE JOB on purpose. `publish` carries `id-token: write` to mint the npm
  # trusted-publishing token; adding `contents: write` there would hand
  # release-creation rights to the job already holding the strongest credential
  # in this workflow. This job takes `contents: write` and no id-token, so
  # neither can do the other's work.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select and validate the tag
        id: tag
        shell: bash
        env:
          REF_NAME_RAW: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$REF_NAME_RAW" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "refusing a tag that is not vX.Y.Z: ${REF_NAME_RAW}" >&2
            exit 1
          fi
          git checkout --quiet "refs/tags/${REF_NAME_RAW}"
          echo "ref_name=${REF_NAME_RAW}" >> "$GITHUB_OUTPUT"

      - name: Create the Release, with its CHANGELOG section as the body
        shell: bash
        env:
          # The validated value, never the raw input — same rule as `publish`.
          REF_NAME: ${{ steps.tag.outputs.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Idempotent: a re-run, or a Release made by hand before this job
          # existed, must not fail the release.
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            echo "Release ${REF_NAME} already exists — nothing to do"
            exit 0
          fi

          # `gh` and python3 are preinstalled on the GitHub-hosted runner.
          # Nothing is installed here: an unpinned network fetch inside a job
          # holding a write token is the exact class this repo's supply-chain
          # check forbids.
          version="${REF_NAME#v}"
          python3 - "$version" <<'PY' > /tmp/release-notes.md
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          # This version's heading up to the next `## [` heading.
          m = re.search(r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)",
                        text, re.S | re.M)
          body = m.group(1).strip() if m else ""
          print(body or f"See CHANGELOG.md for {version}.")
          PY

          gh release create "$REF_NAME" \
            --title "brainiac ${REF_NAME}" \
            --notes-file /tmp/release-notes.md
