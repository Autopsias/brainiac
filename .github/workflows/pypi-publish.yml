name: pypi-publish

# Publishes brainiac-cli to PyPI from CI, over PyPI Trusted Publishing (OIDC).
#
# Why this exists (2026-08-25, from the Codex cloud security round): until now
# the wheel and sdist were built on the maintainer's Mac and pushed with
# `twine` using a long-lived API token. SLSA defines Build L0 as software
# "built and run on the same machine" -- that was us -- and L2 requires
# provenance signed by a HOSTED build platform, which a laptop cannot reach at
# any level of care. The npm side already published this way (see
# npm-publish.yml); the Python side never did.
#
# Two things fall out of the move, neither of which is extra work here:
#   1. There is no long-lived PyPI token to steal. PyPI mints a token from the
#      OIDC identity that dies 15 minutes later.
#   2. `pypa/gh-action-pypi-publish` attaches a PEP 740 attestation by default
#      -- a signed receipt naming the repository, workflow and commit that
#      produced the file. PyPI REFUSES attestations that did not come from a
#      Trusted Publisher, so this artifact could not be produced locally.
#
# The trusted publisher registered on both indexes names this file BY NAME.
# Renaming this workflow breaks publishing until the form is edited to match:
#   pypi.org / test.pypi.org -> brainiac-cli -> Manage -> Publishing
#   owner Autopsias · repository brainiac · workflow pypi-publish.yml
#   environment `pypi` (production) / `testpypi` (rehearsal)
#
# The tag push is what publishes, exactly as it already does for npm. The
# pipeline's `pypi` phase is gone; `phase_post_verify` waits for this workflow
# and then proves the SERVED artifact matches what was built locally, member by
# member (`_archive_content_diff`) -- a comparison written to survive a rebuild,
# which is precisely what a CI build is.
#
# `workflow_dispatch` is kept, and it is the recovery path. A failed OIDC
# exchange publishes NOTHING -- it is not the irreversible half of a release --
# so if the trusted-publisher form and this file ever disagree, fix the form and
# re-run this workflow with `ref` set to the tag. Nothing has to be rebuilt and
# no version is burned.

on:
  push:
    # The public repo's release tags. This is the production publish path.
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Which index to publish to"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]
      ref:
        description: "Tag or commit to build (default: this branch)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build
        # Pinned exactly: tools/check_workflow_supply_chain.py rejects an
        # unpinned install, and this job's output is what the privileged job
        # below uploads to a public index.
        run: |
          set -euo pipefail
          python -m pip install build==1.5.0
          python -m build

      - name: Show what was built
        # A publish job that uploads an empty dist/ would otherwise succeed
        # silently. Fail here instead, where it is cheap and reversible.
        run: |
          set -euo pipefail
          ls -l dist/
          test -n "$(ls -A dist/)" || { echo "::error::dist/ is empty"; exit 1; }
          test "$(ls dist/*.whl | wc -l)" -eq 1 || { echo "::error::expected exactly one wheel"; exit 1; }
          test "$(ls dist/*.tar.gz | wc -l)" -eq 1 || { echo "::error::expected exactly one sdist"; exit 1; }

      - name: Check the build carries no COS
        # ADR 0013: the public package leaves the COS (the private email
        # assistant) out. This is the same checker the release pipeline runs on
        # the Mac, now on the artifact CI is about to hand to the publish job.
        # Stdlib only; it installs nothing.
        run: |
          set -euo pipefail
          python tools/export_check_no_cos.py --dist dist/*

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  verify:
    name: Verify built wheel
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Verify built wheel in clean venv
        # Cleanroom-safe smoke verification of the built wheel in an isolated
        # read-only job (never touching build's dist/ before upload, and never
        # touching private tests/ excluded from Autopsias/brainiac). Exercises
        # the shipped CLI end to end on a disposable fixture vault using the
        # offline hash embedder.
        run: |
          set -euo pipefail
          smoke=$(mktemp -d)
          trap 'rm -rf "$smoke"' EXIT
          python -m venv "$smoke/venv"
          "$smoke/venv/bin/python" -m pip install --no-cache-dir dist/*.whl
          export BRAIN_VAULT="$smoke/vault"
          export BRAIN_INDEX_DIR="$smoke/idx"
          export BRAIN_APP_DATA_DIR="$smoke/app"
          export BRAINIAC_HOME="$smoke/home"
          export BRAIN_EMBEDDER=hash
          export BRAIN_LAUNCHD_DRY_RUN=1
          export BRAIN_LAUNCH_AGENTS_DIR="$smoke/launchagents"
          export BRAIN_LOG_DIR="$smoke/logs"
          "$smoke/venv/bin/brain" --help >/dev/null
          "$smoke/venv/bin/brain" --vault "$BRAIN_VAULT" init --full --json >/dev/null
          mkdir -p "$BRAIN_VAULT/brain/resources"
          cat <<'EOF' > "$BRAIN_VAULT/brain/resources/smoke-decision.md"
          ---
          id: smoke-decision
          title: "Wheel smoke architecture decision"
          type: decision
          classification: Internal
          created: 2026-06-27
          updated: 2026-06-27
          ---

          We decided to use the wheel smoke architecture decision fixture to verify end-to-end indexing, search, and dossier retrieval.
          EOF
          rebuild_out=$("$smoke/venv/bin/brain" --vault "$BRAIN_VAULT" rebuild --json)
          "$smoke/venv/bin/python" -c 'import json, sys; d = json.loads(sys.argv[1]); assert d["indexed"] >= 1 and d["chunks"] >= 1, d' "$rebuild_out"
          search_out=$("$smoke/venv/bin/brain" --vault "$BRAIN_VAULT" search "wheel smoke architecture decision" --json)
          "$smoke/venv/bin/python" -c 'import json, sys; d = json.loads(sys.argv[1]); ids = [r["id"] for r in d["results"]]; assert "smoke-decision" in ids, d' "$search_out"
          dossier_out=$("$smoke/venv/bin/brain" --vault "$BRAIN_VAULT" dossier "wheel smoke architecture decision" --json)
          "$smoke/venv/bin/python" -c 'import json, sys; d = json.loads(sys.argv[1]); dec_ids = [r["id"] for r in d["decisions"]]; assert "smoke-decision" in dec_ids, d' "$dossier_out"
          mkdir -p "$BRAIN_VAULT/overlay/keywords"
          cat <<'EOF' > "$BRAIN_VAULT/overlay/keywords/smoke.md"
          | Term | Expansion | Classification |
          | --- | --- | --- |
          | SmokeSecretTerm | Clean-room wheel smoke fixture | Confidential |
          EOF
          allow_out=$("$smoke/venv/bin/brain" --vault "$BRAIN_VAULT" check-egress "benign smoke query" --json)
          "$smoke/venv/bin/python" -c 'import json, sys; d = json.loads(sys.argv[1]); assert d["allowed"] is True and d["mapped_terms"] >= 1, d' "$allow_out"
          set +e
          block_out=$("$smoke/venv/bin/brain" --vault "$BRAIN_VAULT" check-egress "leaking SmokeSecretTerm" --json)
          block_rc=$?
          set -e
          test "$block_rc" -eq 6 || { echo "::error::expected check-egress exit 6 for Confidential term, got $block_rc"; exit 1; }
          "$smoke/venv/bin/python" -c 'import json, sys; d = json.loads(sys.argv[1]); assert d["allowed"] is False and d["mapped_terms"] >= 1, d' "$block_out"

  publish:
    name: Publish to ${{ inputs.target || 'pypi' }}
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment is what the trusted publisher was registered against, and
    # it is where a manual-approval rule can be attached later without touching
    # this file.
    environment: ${{ inputs.target || 'pypi' }}
    permissions:
      # Mandatory for Trusted Publishing: it is how this job proves its
      # identity to the index. Held at JOB level, not workflow level, so the
      # build job above never carries it.
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # NOTE: this job deliberately installs NOTHING. Everything it needs comes
      # from the pinned action below. An unpinned install in a job holding
      # `id-token: write` is the exact finding that created
      # tools/check_workflow_supply_chain.py.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          # A resumed or re-fired run must not fail on a file the first run
          # already uploaded: an index version is permanent and re-uploading is
          # not an option. Same reasoning as the old twine --skip-existing.
          skip-existing: true
          # attestations default to true; named here so a future edit that
          # disables them is a visible change rather than a silent default.
          attestations: true
          print-hash: true
