name: regression-tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: regression (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      BRAIN_EMBEDDER: hash
      BRAIN_VAULT: ${{ github.workspace }}/vault
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install hash-pinned dependencies and package
        if: matrix.python == '3.13'
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps .
      - name: Test normal package resolution on older supported Python
        if: matrix.python == '3.11'
        # The audit lock's NumPy 2.5 pin requires Python >=3.12. The package
        # supports older Python through its declared ranges, not this lock.
        # Keep that installation path tested rather than dropping this lane.
        run: python -m pip install .
      - name: Verify tests exist before running the public regression suite
        env:
          BRAIN_APP_DATA_DIR: ${{ runner.temp }}/brain-regression
        run: |
          python -c "import pathlib; assert list(pathlib.Path('tests').glob('test_*.py')), 'No regression tests found'"
          python -B -m unittest discover -s tests -p 'test_*.py' -v
