name: Skill Mirror Sync

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  skill-mirror-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate packaged client artifacts (frontmatter/JSON/TOML contract)
        run: python3 tools/package_clients.py --validate-only

      - name: Regenerate mirrors from canonical .claude/skills/
        run: python3 tools/package_clients.py

      - name: Fail if mirrors drifted from canonical skills
        run: |
          git diff --exit-code -- \
            .agents/skills \
            plugins/brainiac-kernel/skills \
            plugins/brainiac-extras/skills \
            plugins/brainiac-manager/skills \
            src/brain/_assets \
            || {
              echo "::error::Skill mirrors are stale or hand-edited. Run 'python3 tools/package_clients.py' and commit the result." >&2
              exit 1
            }
