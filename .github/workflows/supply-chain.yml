name: supply-chain

# Supply-chain hardening gate (from the 2026-07-12 cross-family security review).
# Audits the hash-pinned runtime lock (requirements.lock) for known CVEs and
# publishes a CycloneDX SBOM as a build artifact. Runs on PRs, pushes to master,
# and weekly (so a newly-disclosed CVE in an already-pinned dep is caught even
# without a code change).

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC — catch newly-disclosed CVEs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pip-audit + cyclonedx
        # `--require-hashes` is a boolean flag; `--require-hashes=false` made pip
        # exit 2 ("option does not take a value") on EVERY run of this workflow,
        # so the whole gate — CVE audit, lock-drift check, SBOM — never once
        # executed on the export repo (first noticed 2026-07-30).
        run: python -m pip install pip-audit cyclonedx-bom

      - name: Fail if the lock is stale vs pyproject
        # Regenerate the lock and diff — a drifted lock (a dep added to
        # pyproject but not re-locked) fails the gate so the pinned set can
        # never silently lag the declared deps.
        #
        # SEEDING the check file with the current lock is load-bearing: uv (like
        # pip-compile) only preserves existing pins when the output file already
        # exists. Compiling into an empty /tmp path re-resolves everything to
        # LATEST, so the gate would fail on any upstream release — mcp 1.28.1 ->
        # 2.0.0 and eight others, none of them pyproject drift.
        #
        # The comparison is the PIN SET, not uv's output verbatim: every comment
        # line is stripped from both sides. uv writes the -o path into the header,
        # and its `# via` provenance lists depend on the resolving interpreter
        # (under 3.12 typing-extensions gains anyio/referencing/starlette as
        # parents; under 3.13+ it does not), so a verbatim diff fails on whichever
        # Python happened to run `make lock` — measured on the first green run of
        # this gate, 2026-07-30. A pin that appears, vanishes or changes version
        # still fails it (verified against a lock with numpy deleted).
        #
        # ponytail: comment-only drift is deliberately invisible here. The deeper
        # fix is pinning `--python-version` in BOTH `make lock` and this step, but
        # that re-resolves the lock (3.10 pulls in coloredlogs, exceptiongroup,
        # humanfriendly and a different numpy) — a change to the audited
        # dependency set that belongs in its own reviewed commit, not in a CI fix.
        run: |
          python -m pip install uv
          cp requirements.lock /tmp/requirements.check.lock
          uv pip compile pyproject.toml --extra mcp --extra ingest --extra embed \
            --generate-hashes -o /tmp/requirements.check.lock
          if ! diff <(grep -vE '^\s*#' requirements.lock) \
                    <(grep -vE '^\s*#' /tmp/requirements.check.lock) >/dev/null; then
            echo "::error::requirements.lock is stale — re-run: make lock"
            diff requirements.lock /tmp/requirements.check.lock || true
            exit 1
          fi

      - name: Audit pinned dependencies for known CVEs
        # --no-deps: audit exactly the pinned lines (the lock is the closure).
        # Fails the build on any known vulnerability with a fix available.
        run: pip-audit -r requirements.lock --no-deps --desc

      - name: Generate CycloneDX SBOM
        if: always()
        run: cyclonedx-py requirements requirements.lock -o sbom.cyclonedx.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          # An SBOM is a snapshot of one run's dependency tree; the default
          # 90-day hold keeps 90 days of them for no reader.
          retention-days: 14
