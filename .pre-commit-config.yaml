repos:
  - repo: https://github.com/semgrep/pre-commit
    rev: 'v1.168.0'
    hooks:
      - id: semgrep
        # p/github-actions added 2026-08-07: workflow files were previously
        # unscanned by anything. Measured the same day -- a probe workflow with
        # `pull_request_target` + shell injection + a mutable action tag scored
        # ZERO on the old two-pack config and 3 findings with this pack added.
        #
        # This hook keeps semgrep's DEFAULT per-rule timeout (5s) so committing
        # stays fast. That leaves partial coverage on the largest files
        # (measured: 13 rules time out on core.py/cli.py/index.py/cos.py), which
        # is why .github/workflows/semgrep.yml re-runs the same packs at
        # --timeout 30 in CI. Fast here, complete there.
        #
        # --timeout-threshold 1 added 2026-08-15: a timeout is NOT a finding,
        # but semgrep still exits 1 on timeout ERRORS under --error — measured
        # on the v0.20.11 release commit: 9-10 timeouts on the big
        # src/brain/eval files, "Findings: 0 (0 blocking)" three runs in a row,
        # exit 1 every time, release blocked on a clean tree. With the
        # threshold, a file whose rules time out is SKIPPED (partial coverage,
        # the documented posture above) instead of failing the commit. CI still
        # scans everything at --timeout 30.
        args: ['--config', 'p/python', '--config', 'p/secrets',
               '--config', 'p/github-actions',
               '--error', '--skip-unknown-extensions',
               '--timeout-threshold', '1']

  # Correctness lint. The repo had NO linter of any kind until 2026-08-19, and
  # the first scan found code that cannot run: `tools/cos_mutate_evidence.py`
  # called `evidence_stages.e17_block()`, `subprocess.run()` and `json.loads()`
  # with none of the three names in scope (the s18 split dropped the imports and
  # left a module qualifier behind), `tools/cos_model_answer.py` shadowed an
  # imported SHINGLE_W with an equal literal, and `src/brain/invariants.py`
  # re-exported two names twice. Nothing in the repo could see any of it — the
  # three quality ratchets measure SIZE, not whether a name resolves.
  #
  # Configured in pyproject.toml `[tool.ruff.lint]` as pyflakes + E9 ONLY. This
  # is deliberately not a style gate: no formatter, no line length, no import
  # sorting. Adding those would churn every file and catch no defect. Measured
  # 22 ms over the whole repo, so it stays well inside the cheap-hook budget.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check

  - repo: local
    hooks:
      # semgrep's p/github-actions pack does NOT cover the one workflow finding
      # that actually landed on us (verified 2026-08-07: zero findings on our
      # own npm-publish.yml). This local check covers that class specifically.
      - id: workflow-supply-chain
        name: privileged workflow jobs must not install unpinned packages
        entry: python tools/check_workflow_supply_chain.py
        language: python
        additional_dependencies: ['PyYAML>=6']
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$

      # Two CI gates failed on v0.20.9 and both traced to the same omission: the
      # release bumped pyproject.toml by hand and never ran the packager, which
      # is the step that propagates the SSOT version into package.json and
      # _version.py (ADR-0005 Ruling 1) and regenerates src/brain/_assets/ from
      # the repo-root originals (PYP-02). npm-publish caught it only AFTER the
      # tag was pushed ("tag v0.20.9 does not match package.json 0.20.8"), and
      # Skill Mirror Sync only after an edit had gone into a GENERATED mirror
      # instead of its canonical file. Both are decided by files already in the
      # commit, so both belong here, before the tag exists.
      #
      # --validate-only never writes; it exits non-zero on the same conditions
      # the two workflows check. Measured ~1s, so it stays cheap enough to run
      # on every commit that touches a file it governs.
      - id: packaged-client-artifacts
        name: packaged client artifacts match the version SSOT and their sources
        entry: python3 tools/package_clients.py --validate-only
        language: system
        pass_filenames: false
        files: '^(pyproject\.toml|AGENTS\.md|CLAUDE\.md|README\.md|src/brain/_version\.py|src/brain/_assets/.*|packaging/npm/.*|\.claude/skills/.*|\.agents/skills/.*|plugins/.*)$'

      # The quality ratchet, second iteration. The first (--project . at
      # commit time) died in two days: whole-project judgment refused a
      # one-file commit for 25 files it never touched, and the only local way
      # forward was --no-verify -- which also skipped semgrep and the
      # packaging gate above. Three consecutive bypasses later the ratchet
      # was dead.
      #
      # So the hooks now run --staged: each checker judges ONLY the staged
      # files, and blocks only what THIS commit makes worse than every commit
      # parent (HEAD, plus MERGE_HEAD mid-merge). Debt a commit merely
      # inherits -- a merge landing a long-lived branch, a past bypass --
      # WARNS with a re-record instruction instead of blocking. The
      # whole-project pass lives in CI (.github/workflows/quality-ratchet.yml),
      # which re-runs all three checkers on every push; that job is what makes
      # a local SKIP visible instead of permanent.
      #
      # Sanctioned bypass, if a ratchet hook still blocks you wrongly:
      #   SKIP=file-size-ratchet git commit ...   (comma-separate for several)
      # NEVER --no-verify: it takes the security and packaging gates down too.
      #
      # The checkers are vendored into tools/ (a hook pointing at a home
      # directory fails for every other clone and in CI). Source of truth is
      # gearbox scripts/quality/ via ~/.claude; re-sync with:
      #   python3 ~/.claude/scripts/quality/vendor_quality.py .
      # A client name reached six shipped tool files between v0.20.13 and
      # v0.20.14 and only the RELEASE gate caught it, a day later. Same scan,
      # at commit time. Skips itself (announced) when the external denylist is
      # absent, as on CI.
      - id: client-names
        name: no staged file carries a denylisted client name
        entry: python3 tools/check_client_names.py
        language: system
        pass_filenames: false

      - id: file-size-ratchet
        name: no staged file grows past the size limit (baseline only shrinks)
        entry: python3 tools/check_file_sizes.py --staged
        language: system
        pass_filenames: false
        files: '\.py$'

      - id: function-length-ratchet
        name: no staged function grows past the length limit
        entry: python3 tools/check_function_lengths.py --staged
        language: system
        pass_filenames: false
        files: '\.py$'

      - id: complexity-ratchet
        name: no staged function grows past complexity 12
        entry: python3 tools/check_complexity.py --staged
        language: system
        pass_filenames: false
        files: '\.py$'
