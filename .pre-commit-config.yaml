repos:
  - repo: https://github.com/semgrep/pre-commit
    rev: 'v1.168.0'
    hooks:
      - id: semgrep
        # p/github-actions added 2026-08-07: workflow files were previously
        # unscanned by anything. Measured the same day -- a probe workflow with
        # `pull_request_target` + shell injection + a mutable action tag scored
        # ZERO on the old two-pack config and 3 findings with this pack added.
        #
        # This hook keeps semgrep's DEFAULT per-rule timeout (5s) so committing
        # stays fast. That leaves partial coverage on the largest files
        # (measured: 13 rules time out on core.py/cli.py/index.py/cos.py), which
        # is why .github/workflows/semgrep.yml re-runs the same packs at
        # --timeout 30 in CI. Fast here, complete there.
        args: ['--config', 'p/python', '--config', 'p/secrets',
               '--config', 'p/github-actions',
               '--error', '--skip-unknown-extensions']

  - repo: local
    hooks:
      # semgrep's p/github-actions pack does NOT cover the one workflow finding
      # that actually landed on us (verified 2026-08-07: zero findings on our
      # own npm-publish.yml). This local check covers that class specifically.
      - id: workflow-supply-chain
        name: privileged workflow jobs must not install unpinned packages
        entry: python tools/check_workflow_supply_chain.py
        language: python
        additional_dependencies: ['PyYAML>=6']
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$

      # Two CI gates failed on v0.20.9 and both traced to the same omission: the
      # release bumped pyproject.toml by hand and never ran the packager, which
      # is the step that propagates the SSOT version into package.json and
      # _version.py (ADR-0005 Ruling 1) and regenerates src/brain/_assets/ from
      # the repo-root originals (PYP-02). npm-publish caught it only AFTER the
      # tag was pushed ("tag v0.20.9 does not match package.json 0.20.8"), and
      # Skill Mirror Sync only after an edit had gone into a GENERATED mirror
      # instead of its canonical file. Both are decided by files already in the
      # commit, so both belong here, before the tag exists.
      #
      # --validate-only never writes; it exits non-zero on the same conditions
      # the two workflows check. Measured ~1s, so it stays cheap enough to run
      # on every commit that touches a file it governs.
      - id: packaged-client-artifacts
        name: packaged client artifacts match the version SSOT and their sources
        entry: python3 tools/package_clients.py --validate-only
        language: system
        pass_filenames: false
        files: '^(pyproject\.toml|AGENTS\.md|CLAUDE\.md|README\.md|src/brain/_version\.py|src/brain/_assets/.*|packaging/npm/.*|\.claude/skills/.*|\.agents/skills/.*|plugins/.*)$'
