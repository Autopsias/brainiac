[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name (PYP-01, ADR-0006): `brainiac` is taken on PyPI
# (HTTP 200, verified 2026-07-11); `brainiac-cli` was free (404) at the same
# check. The IMPORT package stays `brain` and the console script stays
# `brain` — only the distribution/project name changes.
name = "brainiac-cli"
version = "0.20.23"
description = "Brainiac — local any-LLM second-brain core engine + brain CLI (Markdown truth, derived SQLite index)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
# DEFAULT INSTALL = FULL CAPACITY (owner decision, 2026-07-04): a plain
# `pip install .` ships real semantic search (direct-ONNX bge-m3-int8), the
# sqlite-vec ANN backend, the signed audit chain, PyYAML, and the ReDoS-guard
# regex engine. The code still degrades gracefully if any of these are absent,
# so constrained environments (Intune / air-gapped) can strip deps with
# `pip install --no-deps .` and re-add what their policy allows — that is a
# technical-team decision, not an install-time menu for the ordinary user.
dependencies = [
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "numpy>=1.24,<3",
    "sqlite-vec>=0.1.6",
    "huggingface-hub>=0.20",
    "cryptography>=41",
    "PyYAML>=6",
    "regex>=2023.0.0",
    # Windows Credential Manager backend for the audit signing key
    # (audit.py resolve/provision import it); no-op elsewhere.
    'keyring>=24; sys_platform == "win32"',
    # ADR-0003 Ruling 1(g): document ingestion (src/brain/ingest/) joins the
    # DEFAULT full-capacity install — pip-installable, pure-ish Python only,
    # NO system binaries (no poppler/tesseract; OCR degrades gracefully absent
    # a local binary, never cloud OCR). `[ingest]` below is a subset alias.
    # >=6.15.0: CVE-2026-71852 / CVE-2026-71870 (memory exhaustion in
    # PDF text extraction) are fixed there. The FLOOR, not just the lock,
    # because requirements.lock is CI/audit-only -- a plain
    # `pip install brainiac-cli` reads THIS constraint, and >=4.0 let the
    # vulnerable 6.14.2 survive an upgrade to 0.20.5 on a real host.
    "pypdf>=6.15.0",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1",
    # S06 (ING-03) image handler metadata (+ OCR text when a LOCAL tesseract
    # binary is present — the pytesseract binding itself stays a fully
    # OPTIONAL, NOT-a-pip-dependency probe: OCR degrades gracefully absent
    # it, matching the ADR's "system binaries are never pip deps" rule).
    "Pillow>=10",
]

[project.optional-dependencies]
# NOTE: vec/audit/yaml/corporate/index below are now SUBSETS of the core
# dependencies — kept only so existing scripts and error-message hints that
# say `pip install .[corporate]` etc. keep working. They add nothing on top
# of a default install.
# Dense-vector ANN backend. When absent the core falls back to the pure-Python
# brute-force VectorBackend (see src/brain/vectors.py) — the adapter interface
# guarantees retrieval works either way.
vec = ["sqlite-vec>=0.1.6"]
# Ed25519 audit chain (CORE-03). Without it the audit hook is unavailable and
# write_note fails closed rather than writing an unsigned record.
audit = ["cryptography>=41"]
# Alternate fastembed-based embedder (NOT installed by default — the default
# semantic path is the direct-ONNX bge-m3-int8 embedder in the core deps).
embed = ["fastembed>=0.3"]
# OCR for SCANNED documents (a PDF with no text layer, a photographed page).
# NOT in the default install and never a cloud call: this is only the binding —
# it needs a LOCAL `tesseract` binary plus its traineddata beside it
# (`brew install tesseract tesseract-lang`, or the distro package). Absent
# either half, ingestion still runs and says so; a scan is then quarantined
# with the missing engine NAMED, never silently dropped.
ocr = ["pytesseract>=0.3.10"]
# CORPORATE minimal-dep set (DIST-01, S12): bge-m3-int8 via DIRECT ONNX Runtime —
# NO fastembed, NO PyTorch. This is what the signed Intune build ships. The
# bge-m3-int8 ONNX model is bundled inline as a data asset (not a pip dep).
corporate = [
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "numpy>=1.24,<3",
    "sqlite-vec>=0.1.6",
    "huggingface-hub>=0.20",
    "cryptography>=41",
    "PyYAML>=6",
]
# YAML frontmatter (optional; a stdlib mini-parser is the fallback).
yaml = ["PyYAML>=6"]
# Document ingestion (ING-01/ING-02) — SUBSET ALIAS of the core deps (Ruling
# 1(g); same vec/audit/yaml pattern): `pip install .[ingest]` keeps error-
# message hints valid even though a default install already has these. Absent,
# `brain ingest` degrades per-handler (reports which extensions are
# unavailable) rather than crashing.
ingest = ["pypdf>=6.15.0", "python-docx>=1.1", "python-pptx>=0.6.23", "openpyxl>=3.1", "Pillow>=10"]
# pytest-xdist/-timeout back the documented parallel suite run (AGENTS.md §8,
# "Running the test suite"): ~15 min sequential -> ~6 min at `-n 8`. Both are
# pytest-dev org, actively maintained. Declared here so a fresh checkout can
# run that command; without them `-n 8` is an unknown-option error.
dev = ["pytest>=7", "build>=1", "pytest-xdist>=3.8", "pytest-timeout>=2.4",
       # The correctness linter behind the pre-commit `ruff-check` hook. Its
       # rule set lives in [tool.ruff.lint] below; declared here so a fresh
       # checkout can run `ruff check .` without the hook.
       "ruff>=0.16"]
# A/B retrieval eval harness (S05): ranx is MIT; numpy comes transitively.
# `pip install -e .[eval]` to run eval/harness.py + eval/gate.py + scripts/ci/eval_gate.sh.
eval = ["ranx>=0.3.20", "numpy>=1.24"]
# One-off model-quantization TOOLING (S09/PF-01): `onnx` is needed ONLY to run
# eval/int8_quantize_e5.py (onnxruntime.quantization depends on it); it is NOT
# a runtime dep of brain.embed.OnnxEmbedder, which loads either fp32 or
# already-quantized int8 weights via onnxruntime alone.
quant-tools = ["onnx>=1.14"]
# OPTIONAL, DELETABLE MCP bridge for the pure Claude Desktop Chat tab only
# (src/brain/mcp_adapter.py). MCP is never the foundation — every other harness
# calls the `brain` CLI directly. `pip install -e .[mcp]` then `brain-mcp`.
# ponytail: capped at <2 because mcp 2.0.0 DELETED mcp.server.fastmcp, which
# brain.mcp_adapter imports — an unbounded `mcp>=1.0` resolved to 2.0.0 on any
# fresh install and `brain-mcp` then died at startup with ModuleNotFoundError,
# taking the whole Chat-tab/.mcpb path with it (caught 2026-07-31 by the
# release pipeline's release-asset handshake gate, after it had already shipped).
# Upgrade path: port the adapter off FastMCP (mcp.server.lowlevel, or the
# separate `fastmcp` package) and lift the cap — a real migration, not a bump.
mcp = ["mcp>=1.0,<2"]
# Timeout-bounded regex engine (mrab-regex) used by BrainIndex.grep's --regex
# path (RET-04 hardening) as a ReDoS guard: regex.search(text, timeout=...)
# genuinely bounds catastrophic backtracking, unlike stdlib `re`. Absent ->
# grep falls back to stdlib re with a pattern-length cap as the sole
# mitigation (documented residual risk: docs/SECURITY_NOTES.md).
# NOTE: added without a lockfile update; a follow-up lockfile PR will pin it.
index = ["regex>=2023.0.0"]

[project.scripts]
brain = "brain.cli:main"
# optional Chat-tab bridge; harmless if [mcp] is not installed (import-time only).
brain-mcp = "brain.mcp_adapter:serve"
# WD-02 golden-set regression probes: resolved from the INSTALLED distribution
# (never repo-relative) so the launchd maintain run — which has no repo CWD —
# can invoke it. `python -m brain.golden_probe` is the equivalent module form.
brain-golden-probe = "brain.golden_probe:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PYP-02: wheel-complete scaffold/registration assets. src/brain/_assets/
# mirrors the repo-root layout (AGENTS.md, templates/, overlay/template/,
# routines/manifest.json, scripts/<registrar + installer scripts>) and is
# SYNCED — never hand-edited — by tools/package_clients.py from the repo-root
# originals (lockstep-validated in --validate-only).
brain = ["_assets/**"]

[tool.claude-quality]
# Trees the size gates skip: frozen plan/archive/evidence dirs and the
# generated _assets mirror of tools/ + scripts/ (re-synced by
# tools/package_clients.py). Not authored source.
exclude = ["_plans", "_archive", "_evidence", "_assets"]

[tool.ruff]
# CORRECTNESS ONLY — this is not a style gate. The repo already has three
# quality ratchets (size, function length, complexity) and a formatter would
# churn every file for no defect caught. What was MISSING was the one class of
# check that finds code which cannot run: the s16/s18 module splits left
# `tools/cos_mutate_evidence.py` calling `evidence_stages.e17_block()`,
# `subprocess.run()` and `json.loads()` with none of the three names in scope,
# and `src/brain/invariants.py` re-exporting two names twice. Nothing in the
# repo could see either one. Hence pyflakes (F) plus E9 (syntax/IO errors),
# and deliberately nothing else.
target-version = "py39"
extend-exclude = ["_plans", "_archive", "_evidence", "src/brain/_assets"]

[tool.ruff.lint]
select = ["F", "E9"]
# F401/F403/F405 are all the same disagreement with this repo's FACADE
# architecture, and it is the architecture that is right.
#
# The s15-s18 splits left behind modules whose entire job is to re-export: a
# `_shared.py` holds one family's imports and every sibling does
# `from ._shared import *`; `cos_runverify.py` binds ~60 names that
# `cos_runverify_io.py` and `tools/cos_judge.py` then read back OFF IT, which
# the doctrine text pins by name. To this rule every one of those imports is
# "unused" — the consumer is another module, which pyflakes cannot see.
#
# MEASURED, 2026-08-19: enabling F401 and applying its 474 automatic fixes
# broke the import graph outright (`ImportError: cannot import name
# '_MARKER_DISPOSITION' from partially initialized module`). It is not a
# tuning problem — the rule cannot tell a dead import from an interface here,
# and a rule whose fix breaks the build is worse than no rule. The three
# defects this lint exists to catch (F821 undefined names, F811 shadowed
# definitions, F841 dead locals) were all found WITHOUT it.
#
# Re-enabling is a real piece of work, not a config change: give every
# deliberate re-export an explicit `X as X` alias (which ruff does accept, and
# which parts of `cos_runverify.py` already use), and then turn this back on.
ignore = ["F401", "F403", "F405"]

[tool.ruff.lint.per-file-ignores]
# F811 cannot see pytest. A module-level `@pytest.fixture def text()` and a test
# that takes `text` as a parameter is the framework's core idiom, and this rule
# reads all 602 of ours as redefinitions. Every one is a false positive; the 44
# real F811s all live outside tests/.
"tests/**" = ["F811"]

[tool.pytest.ini_options]
# Scope collection to tests/ so pytest never descends into a local model venv
# (.venv-embed/) or the fastembed model cache (.fastembed_cache/).
testpaths = ["tests"]

# Import `brain` from THIS checkout's src/, not from whatever editable install
# happens to be in the venv — otherwise a git worktree silently tests the
# parent checkout's engine. (pytest's own ini option; no conftest needed.)
pythonpath = ["src"]

